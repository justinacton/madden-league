name = "madden-league"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# These vars apply to `wrangler pages dev` (npm run preview) and to production
# Cloudflare Pages — NOT to `npm run dev` (astro dev), which reads .env instead.
# Sanity reads are unauthenticated (public dataset, published documents only),
# so no secret/token is needed here for the site itself — only the studio/
# import scripts need a write-access SANITY_TOKEN, kept in studio/.env.
[vars]
USE_MOCK_DATA = "false"
SANITY_PROJECT_ID = "khksb588"
SANITY_DATASET = "production"
